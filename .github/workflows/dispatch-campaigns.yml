name: Dispatch Email Campaigns

# The unattended half of the outbound email engine.
#
# A campaign page in the admin panel drives the dispatcher itself while
# it is open, which is fine for a small send you want to watch. This
# workflow is what finishes a 600-recipient campaign after the tab is
# closed: each run sends one batch per active campaign, so the send
# spreads out instead of arriving as one burst that hurts the domain's
# sending reputation.
#
# GitHub's schedule granularity is 5 minutes, and scheduled runs can be
# delayed under load — that is acceptable here, because the queue is
# durable and nothing is lost by a late batch.
#
# Setup:
#   Settings → Secrets and variables → Actions → New repository secret
#     CRON_SECRET   — must match CRON_SECRET in the Vercel environment
#   (optional) Variables → DISPATCH_URL, if the domain changes.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Never let two dispatchers overlap: the send-row claim guards against
# double sends, but overlapping runs would still waste invocations.
concurrency:
  group: dispatch-campaigns
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send the next batch
        env:
          DISPATCH_URL: ${{ vars.DISPATCH_URL || 'https://www.puravidanaturalindia.com/api/cron/dispatch-campaigns' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set — add it in repository secrets." >&2
            exit 1
          fi

          # The secret goes in a header, never the URL: query strings are
          # recorded in access logs and referrer headers.
          #
          # --fail-with-body so a 4xx/5xx prints the reason before the
          # step goes red, rather than an empty failure.
          curl --fail-with-body --show-error --silent \
               --retry 2 --retry-delay 15 --retry-all-errors \
               --max-time 90 \
               -H "Authorization: Bearer $CRON_SECRET" \
               -X POST "$DISPATCH_URL"
