name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Next.js 16 requires Node >= 20.9. 22 is the current LTS.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # This is the gate that would have caught the unused-variable
      # error that broke the production build (P0-2).
      # `next lint` was removed in Next 16 — this now runs the ESLint CLI.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Real values are needed: the build now prerenders catalog
          # pages, so it genuinely queries Supabase. Add these under
          # Settings → Secrets and variables → Actions.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://www.puravidanaturalindia.com
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory only — reports without blocking the merge. Next.js 14
    # pins a vulnerable postcss that cannot be resolved without the
    # Next 16 upgrade (P2-1, P2-2).
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
